# role-coordinator.conf — thresholds for the chat role-coordinator daemon.
# Shell syntax: sourced by role-coordinator.sh, parsed by role-coordinator.py.

# Where the hub listens. Tailscale-only posture: 127.0.0.1 and nothing else.
HUB=http://127.0.0.1:8000

# Postgres runs in Docker, so psql is reached through the container and no
# password is ever written to a file or an environment variable.
PG_CONTAINER=<PG-CONTAINER>
PG_USER=role-planner
PG_DB=role-planner

# The daemon's own identity in the hub, so its mail and checkpoints are
# attributable and other chats have an address to send questions to.
CHAT_ID=role-coordinator
ROLE=role-coordinator

# A claimed task whose chat has been silent this long gets one chase.
QUIET_HOURS=24

# Never chase the same task more often than this.
CHASE_COOLDOWN_HOURS=24

# A gate whose verifier role has no live holder is called stalled after this
# long, and named in the digest. It is never silently waited on.
VERIFIER_STALL_HOURS=24

# Who verifies when a charter's verifier role has no holder at all. "greg"
# means it goes in the digest for a human; it is never auto-waived.
FALLBACK_VERIFIER=greg

# Routing. A candidate must reach this fit AND be within one matched word of
# the best candidate to receive a forwarded question.
ROUTE_MIN_FIT=0.6

# "topic"          — unroutable questions broadcast to the best-matching topic
# "topic+blocking" — blocking-priority ones may go to the whole open roster
BROADCAST_POLICY=topic

# 1 = report what would happen, change nothing. The daemon ships this way.
# Armed 2026-09-23 at Greg's direction, after a dry run and a self-test.
DRY_RUN=0
